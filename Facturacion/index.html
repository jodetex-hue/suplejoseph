


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación de Productos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Facturación de Productos</h1>

    <label>Producto:</label>
    <input type="text" id="producto">

    <label>Precio:</label>
    <input type="number" id="precio" min="0" step="0.01">

    <label>Cantidad:</label>
    <input type="number" id="cantidad" min="1">

    <button onclick="calcularFactura()">Calcular</button>

    <h2>Detalle de factura</h2>

    <p id="resultado"></p>

    <h3 id="TotalFactura">Total de la Factura:$0.00</h3>

    <script src="js/script.js"></script>
</body>
</html>
